<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" font-family="Ubuntu, 'Open Sans', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- node container -->
  <rect x="140" y="22" width="805" height="376" rx="40" fill="#cccccc" stroke="#444" stroke-width="2.5"/>
  <text x="542" y="66" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">node</text>

  <!-- inbound arrow -->
  <line x1="28" y1="128" x2="84" y2="128" stroke="#eee" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- in_queue -->
  <rect x="86" y="94" width="176" height="68" rx="12" fill="#eeeeee" stroke="#555" stroke-width="1.5"/>
  <text x="174" y="135" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">in_queue</text>

  <!-- _worker -->
  <rect x="348" y="84" width="390" height="104" rx="14" fill="#d9ead3" stroke="#555" stroke-width="1.5"/>
  <text x="364" y="114" font-size="18" font-weight="bold" fill="#111">_worker()</text>
  <text x="724" y="150" font-size="15" text-anchor="end" fill="#111">update(in_queue.get(), state=state)</text>
  <text x="724" y="174" font-size="15" text-anchor="end" fill="#111">transmit(...)</text>

  <!-- destinations -->
  <rect x="890" y="94" width="150" height="68" rx="12" fill="#eeeeee" stroke="#555" stroke-width="1.5"/>
  <text x="965" y="135" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">destinations</text>

  <!-- _source -->
  <rect x="166" y="226" width="140" height="70" rx="12" fill="#f4cccc" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="178" y="257" font-size="18" font-weight="bold" fill="#111">_source()</text>

  <!-- state -->
  <rect x="408" y="248" width="270" height="110" rx="20" fill="#66aaff" stroke="#444" stroke-width="1.5"/>
  <text x="424" y="278" font-size="18" font-weight="bold" fill="#111">state</text>
  <text x="424" y="302" font-size="15" fill="#111">pipeline-owned State</text>
  <text x="424" y="324" font-size="15" fill="#111">messages waiting for others,</text>
  <text x="424" y="344" font-size="15" fill="#111">anything kept across updates</text>

  <!-- links -->
  <line x1="262" y1="128" x2="346" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="738" y1="128" x2="888" y2="128" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M236,226 C236,200 190,196 182,164" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="543" y1="190" x2="543" y2="246" stroke="#555" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
