<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="Ubuntu, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
  <title>Pipeline lifecycle</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#444"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="544" height="504" rx="36" fill="#cccccc" stroke="#444" stroke-width="3"/>

  <g stroke="#444" stroke-width="2">
    <rect x="290" y="28" width="170" height="60" rx="10" fill="#d9ead3"/>
    <rect x="290" y="118" width="170" height="60" rx="10" fill="#66aaff"/>
    <rect x="290" y="208" width="170" height="60" rx="10" fill="#66aaff"/>
    <rect x="290" y="298" width="170" height="60" rx="10" fill="#66aaff"/>
    <rect x="290" y="408" width="170" height="60" rx="10" fill="#66aaff"/>
    <rect x="50" y="408" width="170" height="60" rx="10" fill="#f4cccc"/>
  </g>

  <g text-anchor="middle" fill="#000">
    <text x="375" y="64" font-size="17">init(config)</text>
    <text x="375" y="153" font-weight="bold">status = NEW</text>
    <text x="375" y="243" font-weight="bold">status = READY</text>
    <text x="375" y="333" font-weight="bold">status = RUNNING</text>
    <text x="375" y="443" font-weight="bold">status = STOPPED</text>
    <text x="135" y="443" font-weight="bold">status = DESTROYED</text>
  </g>

  <g fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M375 88V116"/>
    <path d="M375 178V206"/>
    <path d="M375 268V296"/>
    <path d="M375 358V406"/>
    <path d="M290 438H222"/>
    <path d="M290 148C180 148 135 250 135 406"/>
    <path d="M290 238C200 238 150 300 142 406"/>
    <path d="M290 328C220 328 165 360 150 406"/>
  </g>

  <g fill="#000">
    <text x="385" y="198">warmup()</text>
    <text x="385" y="288">start()</text>
    <text x="385" y="388">stop() / kill()</text>
    <text x="228" y="428" font-size="13">destroy()</text>
    <text x="62" y="250">destroy()</text>
  </g>
</svg>
